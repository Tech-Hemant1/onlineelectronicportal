<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Orbitron', sans-serif;
    }

    body {
        height: 100vh;
        background: radial-gradient(circle at top left, #0a0a0a, #000);
        display: flex;
        justify-content: center;
        align-items: center;
        color: #0ff;
        overflow: hidden;
    }

    .container {
        text-align: center;
        padding: 60px 90px;
        border: 2px solid #0ff;
        border-radius: 20px;
        box-shadow: 0 0 40px #0ff, inset 0 0 20px #00f6ff;
        background: rgba(10, 10, 10, 0.7);
        backdrop-filter: blur(6px);
        transition: transform 0.4s ease;
    }

    .container:hover {
        transform: scale(1.02);
    }

    h1 {
        font-size: 2rem;
        margin-bottom: 40px;
        text-shadow: 0 0 20px #00ffff;
        letter-spacing: 2px;
    }

    input[type="text"],
    input[type="password"] {
        width: 80%;
        padding: 12px;
        margin: 10px 0;
        border: 2px solid #00ffff;
        border-radius: 10px;
        background-color: rgba(0, 20, 20, 0.8);
        color: #0ff;
        font-size: 1rem;
        outline: none;
        text-align: center;
        transition: all 0.3s ease;
        box-shadow: 0 0 10px #00ffff33;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
        box-shadow: 0 0 25px #00ffff, 0 0 50px #00ffff;
    }

    input[type="submit"] {
        background: transparent;
        color: #0ff;
        border: 2px solid #0ff;
        padding: 12px 40px;
        border-radius: 50px;
        margin-top: 25px;
        font-size: 1.1rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 0 15px #0ff, inset 0 0 10px #00ffff44;
    }

    input[type="submit"]:hover {
        background: #0ff;
        color: #000;
        box-shadow: 0 0 25px #0ff, 0 0 50px #00ffff;
        transform: scale(1.1);
    }

    /* Glow animation */
    .glow {
        position: absolute;
        width: 400px;
        height: 400px;
        background: radial-gradient(circle, rgba(0,255,255,0.3), transparent 70%);
        animation: pulse 5s infinite alternate;
        filter: blur(100px);
        z-index: -1;
    }

    @keyframes pulse {
        from { transform: scale(1); opacity: 0.6; }
        to { transform: scale(1.3); opacity: 1; }
    }

</style>
</head>
<body>

<div class="glow" style="top: 10%; left: 15%;"></div>
<div class="glow" style="bottom: 15%; right: 10%; animation-delay: 2s;"></div>

<div class="container">
    <h1>👨‍💻 Admin Login 👨‍💻</h1>

    <form action="alog" method="post">
        <input type="text" name="a_name" placeholder="Enter Username"><br>
        <input type="password" name="a_pwd" placeholder="Enter Password"><br>
        <input type="submit" value="Login">
    </form>
</div>

</body>
</html>
