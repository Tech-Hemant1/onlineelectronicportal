<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Electronic Portal</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

<style>
    /* Reset */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Orbitron', sans-serif; }

    body {
        height: 100vh;
        background: radial-gradient(circle at top left, #0a0a0a, #000);
        display: flex;
        justify-content: center;
        align-items: center;
        color: #0ff;
        overflow: hidden;
    }

    /* Glow elements */
    .glow {
        position: absolute;
        width: 400px;
        height: 400px;
        background: radial-gradient(circle, rgba(0,255,255,0.28), transparent 70%);
        animation: pulse 5s infinite alternate;
        filter: blur(100px);
        z-index: -1;
    }
    @keyframes pulse {
        from { transform: scale(1); opacity: 0.6; }
        to   { transform: scale(1.3); opacity: 1; }
    }

    .container {
        text-align: center;
        padding: 60px 90px;
        border: 2px solid #0ff;
        border-radius: 20px;
        box-shadow: 0 0 40px #0ff, inset 0 0 20px #00f6ff;
        background: rgba(10, 10, 10, 0.72);
        backdrop-filter: blur(5px);
        transition: transform 0.4s ease;
    }
    .container:hover { transform: scale(1.02); }

    h1 {
        font-size: 2rem;
        margin-bottom: 40px;
        text-shadow: 0 0 20px #00ffff;
        letter-spacing: 2px;
    }

    /* Neon Buttons */
    .btn {
        display: inline-block;
        margin: 15px;
        padding: 15px 50px;
        color: #0ff;
        font-size: 1.1rem;
        text-decoration: none;
        border: 2px solid #0ff;
        border-radius: 50px;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    .btn::before {
        content: "";
        position: absolute;
        top: 0; left: -100%;
        width: 100%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(0,255,255,0.4), transparent);
        transition: all 0.4s ease;
    }
    .btn:hover::before { left: 100%; }
    .btn:hover {
        color: #000;
        background: #0ff;
        box-shadow: 0 0 20px #0ff, 0 0 40px #00ffff;
        transform: translateY(-4px);
    }

    footer {
        position: absolute;
        bottom: 15px;
        color: #88f0ff;
        font-size: 0.9rem;
        text-align: center;
        width: 100%;
        text-shadow: 0 0 10px #00ffff;
        opacity: 0.9;
    }

    /* small responsive tweak */
    @media (max-width: 480px) {
        .container { padding: 28px; width: calc(100% - 40px); }
        .btn { padding: 12px 25px; font-size: 0.95rem; }
        h1 { font-size: 1.5rem; }
    }
</style>
</head>
<body>
    <div class="glow" style="top: 10%; left: 6%;"></div>
    <div class="glow" style="bottom: 8%; right: 12%; animation-delay: 2s;"></div>

    <div class="container">
        <h1>⚡ Online Electronic Portal ⚡</h1>
        <a href="AdminLogin.html" class="btn" id="adminBtn">Admin Login</a>
        <a href="CustomerLogin.html" class="btn" id="customerBtn">Customer Login</a>
    </div>

    <footer>© 2025 Online Electronic Portal | Designed by Hemant</footer>

<script>
    // Click feedback (non-blocking)
    const buttons = document.querySelectorAll('.btn');
    buttons.forEach(btn => {
        btn.addEventListener('click', (e) => {
            // visual feedback without preventing default navigation
            btn.style.boxShadow = '0 0 60px #00ffff, 0 0 100px #0ff';
            setTimeout(() => {
                btn.style.boxShadow = '0 0 20px #0ff, 0 0 40px #00ffff';
            }, 400);
            // optionally show a subtle toast instead of alert
            // alert("Redirecting to " + btn.textContent + "...");
        });
    });
</script>
</body>
</html>
